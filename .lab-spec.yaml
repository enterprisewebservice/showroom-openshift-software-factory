# Lab specification — drives /showroom:create-lab (ph_payload shape).
# Iterate here first; regenerate modules from this spec.
ph_payload:
  target_dir: content/modules/ROOT/pages/
  mode: new
  spec:
    lab_name: "The OpenShift Software Factory — Agents as Staff"
    audience: "Platform engineers, architects, and technical sellers"
    experience_level: intermediate
    main_learning_goal: >-
      Stand up and operate a governed AI software factory on OpenShift: hire agents through
      Developer Hub, govern every tool call, teach skills as versioned artifacts, run headless
      agents in pipelines, and ship a real microservice to production with an agent doing the work.
    learning_objectives:
      - Provision a governed AI agent from a Developer Hub template and trace everything it created in git
      - Govern agent tool access through an MCP gateway with per-call authorization and a full audit trail
      - Deliver know-how to an agent as a versioned skill artifact and watch behavior change
      - Run a headless agent inside a Tekton pipeline with autonomy set by gateway profile
      - Ship a microservice to production through the agent-driven supply chain (build, sign, scan, promote) and watch the requesting agent consume it as a new governed tool
      - Swap the agent's model between a frontier endpoint and a sovereign in-cluster vLLM without touching anything else
    business_scenario: >-
      ACME Financial wants what AgentWorks (fictional composite vendor) sells — AI development agents that deliver real work —
      but their platform team cannot hand credentials, audit, or the supply chain to a vendor
      control plane. In this lab you build the equivalent capability on the OpenShift platform
      they already govern, then put it to work shipping software.
    duration: half-day (~4 hours hands-on)
    module_outline: |
      Module 1 (~30 min): Hire an agent — one sentence in the Dev Hub template; review the wiring (skills, tools, gateway, brain); agent live in ~2 minutes. [AgentWorks: hosted-agent onboarding]
      Module 2 (~25 min): The agent is in git — edit the agent's prompt via PR, watch OpenShift GitOps reconcile, roll it back. [AgentWorks: where does the hosted agent live?]
      Module 3 (~30 min): Governed tools — call a tool through the MCP gateway as the agent; hunt the credentials (two classes: gateway-injected tools have none anywhere in the namespace; pass-through tools carry a platform-minted per-seat Secret the RUNTIME holds but the agent's shell-less tool list can never read); read the audit line. [AgentWorks: connectors, with enterprise trust]
      Module 4 (~30 min): Teach with a skill artifact — install a versioned skill pack; re-run the task; the agent now follows the procedure. [AgentWorks: skills/harness, supply-chain graded]
      Module 5 (~30 min): Headless agent in the pipeline — trigger a Tekton PipelineRun with an agent task; autonomy tier is the gateway profile bound to the run. [AgentWorks: the headless runner + autonomy levels]
      Module 6 (~60 min, capstone): Ship to production AND close the loop — file an intent with the ops manager; a dev agent scaffolds the microservice from a golden-path template; the supply-chain pipeline builds, signs and scans; GitOps promotes; then the beat that makes it Morgan's Monday: the shipped service is registered behind the MCP gateway (MCPServerRegistration) and the REQUESTING agent calls it as a governed tool to complete the original intent, posting the business result in Mattermost. The attendee reads the gateway audit line for that call. The factory's output became the factory's new capability — AgentWorks ships a fixed connector catalog; this factory grows its own. [AgentWorks: the software factory + connectors, with SLSA provenance]
      Module 7 (~20 min): Swap the brain — change the model reference frontier ↔ sovereign vLLM; re-run Module 4's task; nothing else changed. [AgentWorks: model independence, plus the part a SaaS cannot do — you RUN the model]
      Module 8 (~15 min): The gap map — honest AgentWorks comparison: what this stack still lacks (mission-dashboard UX, automated repo wiki, session forking, one-flag autonomy) and why every gap is UI/ergonomics while none are trust, governance, or deployment reach.
    env:
      lab_type: ocp
      cluster_type: multinode
      access: multi-user keycloak
      ocp_version: "{ocp_version}"
      attributes:
        user: "{user}"
        password: "{password}"
        openshift_console_url: "{openshift_console_url}"
        openshift_api_url: "{openshift_api_url}"
        devhub_url: "{devhub_url}"
        gitops_url: "{gitops_url}"
        mattermost_url: "{mattermost_url}"
    reference_materials:
      - ~/vibe-projects/sandboxd/governed-agent-platform/docs/openshift-software-factory-blueprint.md
      - https://rhpds.github.io/rhdp-skills-marketplace/reference/best-practices.html
    writing_style: >-
      Direct technical-seller voice: concrete, active, no rallying cries or filler. Every claim
      demonstrable in the environment. Short paragraphs. The attendee is treated as a competent
      platform person seeing agents-as-workloads for the first time.
vendor_naming: >-
  AgentWorks is the workshop's FICTIONAL composite stand-in for commercial AI-dev-agent
  platforms. Never name real vendors in workshop-facing content, catalog descriptions, or blogs.
notes:
  model_access: >-
    OpenShift AI Models-as-a-Service (early access — label support status honestly in lab copy).
    External frontier models brokered by MaaS with per-user keys/quotas; optional in-cluster vLLM
    registered into the same MaaS as the sovereign endpoint for Module 7's swap. Agents never hold
    provider credentials. Deployer: enterprisewebservice/software-factory-deployer.
  showroom_setup:
    deployment: ocp
    tabs: [terminal, openshift-console, developer-hub]
    theme: red-hat-default
    ftl_e2e: planned (later, /ftl:rhdp-lab-validator)
  milestones:
    A: content complete + deliverable instructor-led against salamander
    B: agnosticd-v2 workload + AgnosticV catalog item (self-service on demo.redhat.com)
  governed_gitea_tools: >-
    Live 2026-08-25 (Module 3 implications): workshop hires now get gitea_* tools (54) through
    the governed MCP gateway, authenticated PER SEAT — the agent's AgentGateway sends the seat's
    own Gitea token (Secret <user>-gitea-token, minted by the deployer's gitea stage) and
    gitea-mcp consumes it per call, so tool actions run as the attendee's Gitea user against
    their own org, and a call without the credential fails closed. Good demo beat: gitea_get_me
    returns userN; the gateway's Envoy access log is the audit trail. Contrast with github_*:
    those tools are the reference cluster's platform-identity pattern and are NOT part of the
    workshop story — do not script beats against them from seat agents (the shared gateway still
    exposes the github backend under UNPREFIXED tool names with the platform App identity;
    per-user tool filtering is not yet enabled — an honest-labeling caveat, not a feature).
  style_exceptions: >-
    Em dashes are an accepted, deliberate part of this lab's voice (used
    consistently across all verified modules); reviewers should not flag
    them. Numerals for 0-9 per Red Hat style otherwise applies.
  capstone_source: >-
    Module 6 is the ops-manager production story from the Agents as Staff series: dev agent
    generates a microservice via the golden-path template, Tekton/TSSC builds signed artifacts,
    GitOps promotes to production. Environment reset uses the genesis teardown plus
    cleanup-agent.sh (removes the RHDH catalog Location).
