---
type: showroom

default_width: 35
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

# Terminal is same-origin (proxied at /terminal) so it embeds in the split
# view. Every other surface sends X-Frame-Options: DENY/SAMEORIGIN (verified
# live 2026-08-25) — iframing them renders a blank white pane, so those tabs
# are external: clicking one opens the console in its own browser tab.
tabs:
  - name: Terminal
    path: /terminal
    port: 443
  - name: OpenShift Console
    url: 'https://console-openshift-console.apps.salamander.aimlworkbench.com'
    external: true
  - name: Developer Hub
    url: 'https://v1-developer-hub-rhdh-test.apps.salamander.aimlworkbench.com'
    external: true
  - name: GitOps
    url: 'https://openshift-gitops-server-openshift-gitops.apps.salamander.aimlworkbench.com'
    external: true
  - name: Mattermost
    url: 'https://mattermost-mattermost.apps.salamander.aimlworkbench.com'
    external: true
